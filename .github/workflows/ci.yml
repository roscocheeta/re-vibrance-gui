name: CI

on:
  push:
    branches: [ "master", "dev" ]
    tags: [ "v*.*.*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "master", "dev" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ReVibranceGUI.sln

    - name: Build
      run: dotnet build ReVibranceGUI.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test ReVibranceGUI.sln --configuration Release --no-build --verbosity normal

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      if: success() && !startsWith(github.ref, 'refs/tags/v')
      with:
        name: ReVibranceGUI-Release
        path: ReVibranceGUI/bin/Release/net8.0-windows/
        retention-days: 7

    - name: Zip for Release
      if: startsWith(github.ref, 'refs/tags/v')
      run: Compress-Archive -Path ReVibranceGUI/bin/Release/net8.0-windows/* -DestinationPath ReVibranceGUI.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: ReVibranceGUI.zip
        generate_release_notes: true
