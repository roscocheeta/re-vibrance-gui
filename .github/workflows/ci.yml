name: CI

on:
  push:
    branches: [ "master", "dev" ]
    tags: [ "v*.*.*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "master", "dev" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Setup .NET 8
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ReVibranceGUI.sln

    - name: Verify Formatting
      run: |
        dotnet format ReVibranceGUI/ReVibranceGUI.csproj --verify-no-changes
        dotnet format ReVibranceGUI.Tests/ReVibranceGUI.Tests.csproj --verify-no-changes
      continue-on-error: true

    - name: Build
      run: dotnet build ReVibranceGUI.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test ReVibranceGUI.sln --configuration Release --no-build --verbosity normal

    - name: Upload Build Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ReVibranceGUI-Release
        path: ReVibranceGUI/bin/Release/net8.0-windows/
        retention-days: 7

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: ReVibranceGUI-Release
        path: ReVibranceGUI-Release

    - name: Zip for Release
      run: Compress-Archive -Path ReVibranceGUI-Release/* -DestinationPath ReVibranceGUI-${{ github.ref_name }}.zip

    - name: Generate Checksum
      run: |
        $hash = Get-FileHash ReVibranceGUI-${{ github.ref_name }}.zip -Algorithm SHA256
        $hashString = $hash.Hash + "  ReVibranceGUI-${{ github.ref_name }}.zip"
        Set-Content -Path ReVibranceGUI-${{ github.ref_name }}.zip.sha256 -Value $hashString

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.0.8
      with:
        files: |
          ReVibranceGUI-${{ github.ref_name }}.zip
          ReVibranceGUI-${{ github.ref_name }}.zip.sha256
        generate_release_notes: true
