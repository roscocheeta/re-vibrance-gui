name: CI

on:
  push:
    branches: [ "master", "dev" ]
    tags: [ "v*.*.*" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [ "master", "dev" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        submodules: recursive

    - name: Setup .NET 8
      uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ReVibranceGUI.sln

    - name: Verify Formatting
      run: |
        dotnet format ReVibranceGUI/ReVibranceGUI.csproj --verify-no-changes
        dotnet format ReVibranceGUI.Tests/ReVibranceGUI.Tests.csproj --verify-no-changes
      continue-on-error: true

    - name: Build
      run: dotnet build ReVibranceGUI.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test ReVibranceGUI.sln --configuration Release --no-build --verbosity normal

    - name: Upload Build Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ReVibranceGUI-Release
        path: ReVibranceGUI/bin/Release/net8.0-windows/
        retention-days: 7

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
    - name: Download Build Artifact
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
      with:
        name: ReVibranceGUI-Release
        path: ReVibranceGUI-Release

    - name: Zip for Release
      run: Compress-Archive -Path ReVibranceGUI-Release/* -DestinationPath ReVibranceGUI.zip

    - name: Generate Checksum
      run: |
        $hash = Get-FileHash ReVibranceGUI.zip -Algorithm SHA256
        $hashString = $hash.Hash + "  ReVibranceGUI.zip"
        Set-Content -Path ReVibranceGUI.zip.sha256 -Value $hashString

    - name: Create GitHub Release
      uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.0.8
      with:
        files: |
          ReVibranceGUI.zip
          ReVibranceGUI.zip.sha256
        generate_release_notes: true
