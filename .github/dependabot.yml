version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      github-actions:
        patterns:
          - "*"

  # Maintain dependencies for .NET (NuGet)
  - package-ecosystem: "nuget"
    directory: "/ReVibranceGUI"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      nuget-app:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/ReVibranceGUI.Tests"
    schedule:
      interval: "weekly"
    target-branch: "dev"
    groups:
      nuget-tests:
        patterns:
          - "*"
