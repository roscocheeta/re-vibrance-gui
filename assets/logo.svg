<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Vibrant, high-contrast gradient -->
    <linearGradient id="vibranceGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#00E5FF" />
    </linearGradient>
  </defs>
  
  <!-- Windows 11 Fluent Squircle Background -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="#1C1C1C" />
  
  <!-- Minimalist 'V' (Maximized for high visibility across high-DPI and system tray) -->
  <path d="M 46 68 L 128 204 L 210 68" 
        fill="none" 
        stroke="url(#vibranceGrad)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
